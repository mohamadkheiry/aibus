name: CI
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore AiBus.slnx
      - run: dotnet build AiBus.slnx -c Release --no-restore
      - run: dotnet test AiBus.slnx -c Release --no-build
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/AiBus.Web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AiBus.Web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build
